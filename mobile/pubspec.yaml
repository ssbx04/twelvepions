name: twelvepions
description: "12 Pions — le jeu de dames sénégalais"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management (BLoC)
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0

  # Dependency injection
  get_it: ^8.0.0

  # HTTP
  dio: ^5.7.0

  # Functional helpers
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Stockage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.6.2

  # Realtime
  web_socket_channel: ^3.0.1

  # UI / assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Audio
  audioplayers: ^6.1.0

  cupertino_icons: ^1.0.8

  # Notifications
  flutter_local_notifications: ^17.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/sounds/
