spring:
  application:
    name: 12pions-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/twelvepions
    username: twelvepions
    password: dev_only_change_in_prod

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

logging:
  level:
    sn.twelvepions: DEBUG
    org.springframework.web: INFO

# Custom config
app:
  jwt:
    secret: dev-only-change-in-prod-this-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 604800000  # 7 jours
  otp:
    # En dev : OTP imprimé dans le terminal au lieu d'être envoyé par SMS.
    # En prod : on branchera Africa's Talking ici.
    provider: console
    code-length: 6
    expiration-seconds: 300  # 5 minutes
    resend-cooldown-seconds: 30
