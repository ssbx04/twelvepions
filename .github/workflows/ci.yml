name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twelvepions
          POSTGRES_USER: twelvepions
          POSTGRES_PASSWORD: testpwd
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5435/twelvepions
          SPRING_DATASOURCE_USERNAME: twelvepions
          SPRING_DATASOURCE_PASSWORD: testpwd
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          APP_JWT_SECRET: ci-only-secret-must-be-at-least-256-bits-long-for-hs256-algo
        run: ./gradlew test --no-daemon

  deploy:
    name: Deploy → Render
    needs: backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: curl -X POST "https://api.render.com/deploy/srv-d80bgvn7f7vs73cnj160?key=fg2669XpdZ4"
