services:
  postgres:
    image: postgres:16-alpine
    container_name: 12pions-postgres
    environment:
      POSTGRES_DB: twelvepions
      POSTGRES_USER: twelvepions
      POSTGRES_PASSWORD: dev_only_change_in_prod
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twelvepions -d twelvepions"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 12pions-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
